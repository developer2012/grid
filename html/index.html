<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uyga Vazifalar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>

<body class="bg-black text-white min-h-screen flex items-center justify-center">
  <div id="app" class="w-full px-4 max-w-xl text-center"></div>

  <script>
    const app = document.getElementById("app");
    let yosh = Number(prompt("Yoshingizni kiriting:"));

    if (yosh < 18) {
      app.innerHTML = `
        <div class="bg-red-700 p-6 rounded-lg">
          <p class="text-2xl font-semibold">⛔ Kirish taqiqlangan: 18 yoshdan kichiksiz</p>
        </div>
      `;
    } else {
      app.innerHTML = `
        <div class="space-y-6">
          <h1 class="text-green-400 text-2xl font-bold">✅ Xush kelibsiz! Sizga ruxsat berildi.</h1>
          <div class="flex flex-col gap-4">
          
            <a href="homework.html" class="bg-green-600 hover:bg-green-800 text-white py-3 rounded-lg text-lg transition">Sahifaga kiring</a>
          </div>
        </div>
      `;
    }
  </script>
</body>

</html>
