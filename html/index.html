<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>uyga vazifalar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white font-sans">

  <!-- Bu joyni JS orqali ko‘rsatamiz -->
  <div id="content" class="pt-6 flex flex-col items-start gap-4 px-6"></div>

  <script>
    let yosh = Number(prompt("Yoshingizni kiriting:"));
    const content = document.getElementById("content");

    if (yosh < 18) {
      content.innerHTML = `
        <div class='bg-red-700 p-4 rounded-md text-center w-full'>
          ⛔ <strong>Kirish taqiqlangan:</strong> 18 yoshdan kichiksiz
        </div>
      `;
    } else {
      content.innerHTML = `
        <div class='mb-6 text-green-400 text-lg font-semibold'>✅ Xush kelibsiz! Sizga ruxsat berildi.</div>
        <a href="/index-homework.html" class="text-white text-[20px] bg-blue-600 hover:bg-blue-800 px-4 py-2 rounded-md inline-block">Homework-1</a>
        <a href="/homework.html" class="text-white text-[20px] bg-green-600 hover:bg-green-800 px-4 py-2 rounded-md inline-block">Homework-2</a>
      `;
    }
  </script>
</body>
</html>
